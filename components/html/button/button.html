<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unslop — Honest Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="button.css">
</head>
<body>
  <p class="demo-note"><a href="../index.html">← Unslop catalog</a> · button</p>

  <main class="demo">
    <h1>The Honest Button</h1>
    <p class="lede">Workwear-inspired. Chunky ink border, hard offset shadow, uppercase grotesk label. No gradients, no glow, no glass.</p>

    <div class="row">
      <button class="btn" type="button">Primary</button>
      <button class="btn btn--secondary" type="button">Secondary</button>
      <button class="btn btn--ghost" type="button">Ghost</button>
    </div>
    <div class="row">
      <button class="btn btn--sm" type="button">Small</button>
      <button class="btn" type="button" disabled>Disabled</button>
      <button class="btn btn--lg" type="button">Large button →</button>
    </div>
  </main>
</body>
</html>
