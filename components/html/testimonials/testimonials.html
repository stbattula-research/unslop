<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unslop — Margin Notes Testimonials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="testimonials.css">
</head>
<body>
  <p class="demo-note"><a href="../index.html">← Unslop catalog</a> · testimonials</p>

  <!-- The component -->
  <section class="blurbs">
    <div class="blurbs__inner">
      <h2 class="blurbs__heading">Kind words, in the margins.</h2>

      <div class="blurbs__grid">
        <figure class="blurb">
          <span class="blurb__mark" aria-hidden="true">&ldquo;</span>
          <blockquote class="blurb__quote">It looks like someone stayed up late on purpose, not like a template stayed up late by default.</blockquote>
          <figcaption>
            <p class="blurb__name">— Mara Ellison</p>
            <p class="blurb__role">Design lead, Fieldnotes</p>
            <p class="blurb__margin">Switched their whole marketing site in a weekend.</p>
          </figcaption>
        </figure>

        <figure class="blurb">
          <span class="blurb__mark" aria-hidden="true">&ldquo;</span>
          <blockquote class="blurb__quote">Our users stopped asking which AI built the site. That was the entire brief, and it worked.</blockquote>
          <figcaption>
            <p class="blurb__name">— Dev Okafor</p>
            <p class="blurb__role">Founder, Ledgerly</p>
            <p class="blurb__margin">Ships with the React registry; never touched the CSS.</p>
          </figcaption>
        </figure>

        <figure class="blurb">
          <span class="blurb__mark" aria-hidden="true">&ldquo;</span>
          <blockquote class="blurb__quote">Finally, components with a point of view. The colophon footer alone was worth the star.</blockquote>
          <figcaption>
            <p class="blurb__name">— June Park</p>
            <p class="blurb__role">Independent developer</p>
            <p class="blurb__margin">Contributed the poster CTA in a single PR.</p>
          </figcaption>
        </figure>
      </div>
    </div>
  </section>
</body>
</html>
